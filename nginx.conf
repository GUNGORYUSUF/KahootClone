worker_processes 1;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    # YENİ: Gelen isteğin türüne göre Connection başlığını dinamik ayarlar.
    # Sadece WebSocket isteklerinde 'upgrade' yapar, diğerlerinde normal HTTP (close) bırakır.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker'ın iç DNS'i 'api' ismini tüm çoğaltılmış (scaled) konteynerlere yönlendirir.
    upstream api_servers {
        ip_hash;
        server api:8080;
    }

    server {
        listen 80;

        # Normal HTTP İstekleri (Frontend HTML dosyaları ve API uç noktaları)
        location / {
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SignalR (WebSockets) İstekleri için Özel Ayar
        location /gamehub {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}