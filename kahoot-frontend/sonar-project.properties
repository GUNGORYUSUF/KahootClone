# kahoot-frontend/sonar-project.properties
# SonarQube - Frontend Proje Konfigurasyonu
# sonar-docker-analiz.ps1 tarafindan otomatik kullanilir.
# sonar.host.url ve sonar.token runtime'da -D parametresiyle gecilir (dosyada saklanmaz).

sonar.projectKey=kahoot-frontend
sonar.projectName=Kahoot Clone - Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.typescript.tsconfigPath=tsconfig.app.json
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/public/**
sonar.sourceEncoding=UTF-8
