<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Kahoot Clone - Oyuncu Ekranı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        .option-btn {
            height: 150px;
            font-size: 1.5rem;
            transition: transform 0.1s;
        }

        .option-btn:active {
            transform: scale(0.95);
        }

        .disabled-btn {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>

<body class="bg-dark text-center mt-5" id="mainBody">

    <div class="container" style="max-width: 500px;">

        <div id="loginArea">
            <h1 class="display-4 fw-bold text-white mb-4">Oyuna Katıl</h1>
            <div class="card shadow p-4 rounded-4 border-0 bg-light">
                <input type="text" id="pinInput" class="form-control form-control-lg mb-3 text-center fw-bold"
                    placeholder="PIN Kodu" maxlength="6">
                <input type="text" id="nicknameInput" class="form-control form-control-lg mb-4 text-center"
                    placeholder="Takma Adın">
                <button id="btnJoin" class="btn btn-dark btn-lg w-100 fw-bold" disabled>Bağlanıyor...</button>
            </div>
        </div>

        <div id="waitingArea" style="display: none;" class="mt-5 text-white">
            <h1 class="display-1 fw-bold mb-4">⏳</h1>
            <h2 class="fw-bold">İçeridesin!</h2>
            <p class="fs-5 mt-3">Yöneticinin oyunu başlatması bekleniyor...</p>
        </div>

        <div id="questionArea" style="display: none;" class="mt-3">
            <h4 id="studentTimerDisplay" class="text-warning mb-3 fw-bold"></h4>
            <h3 id="studentQuestionText" class="text-white fw-bold mb-4"></h3>
            <div class="row g-3" id="studentOptionsArea"></div>
        </div>

        <div id="answeredArea" style="display: none;" class="mt-5 text-white">
            <h1 class="display-1 fw-bold mb-4">🤔</h1>
            <h2 class="fw-bold">Cevabın Kaydedildi!</h2>
            <p class="fs-5 mt-3">Sürenin dolması ve sonuçların açıklanması bekleniyor...</p>
            <h3 class="text-warning mt-4 fw-bold">Kalan Süre: <span id="answeredTimeLimit" class="fs-2"></span> saniye
            </h3>
        </div>

        <div id="resultArea" style="display: none;" class="mt-5 text-white">
            <h1 id="resultIcon" class="display-1 mt-5"></h1>
            <h2 id="resultText" class="mt-4 fw-bold"></h2>

            <div id="studentTransitionLeaderboardArea" class="mt-4" style="display: none;">
                <h4 class="text-white mb-3">🏆 İlk 5 Liderlik Tablosu</h4>
                <ul id="studentTransitionLeaderboardList" class="list-group w-100 mx-auto shadow-lg text-dark"></ul>
            </div>

            <p id="nextQuestionText" class="text-light mt-3 fs-4 fw-bold"></p>
        </div>

        <div id="leaderboardArea" class="mt-5" style="display: none;">
            <h1 class="display-4 fw-bold text-white mb-4">🏆 Oyun Bitti! 🏆</h1>
            <ul id="leaderboardList" class="list-group w-100 mx-auto fs-5 shadow-lg text-dark mb-5"></ul>
            <button class="btn btn-light btn-lg w-100 fw-bold" onclick="location.reload()">Yeni Oyuna Katıl</button>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script>
        let currentPin = "";
        let currentNickname = "";
        let currentQuestionId = "";
        let currentOptions = [];
        let pendingResult = { isCorrect: null, points: 0 };
        let hasJoinError = false;

        const connection = new signalR.HubConnectionBuilder().withUrl("/gamehub", {
            skipNegotiation: true,
            transport: signalR.HttpTransportType.WebSockets
        }).build();
        
        // YENİ: Bağlantı kurulana kadar butonu kilitli tutar, kurulduğunda açar.
        async function startConnection() {
            try {
                await connection.start();
                const btnJoin = document.getElementById("btnJoin");
                btnJoin.disabled = false;
                btnJoin.innerText = "Giriş Yap";
            } catch (err) {
                console.error("SignalR Bağlantı Hatası:", err);
                document.getElementById("btnJoin").innerText = "Bağlantı Hatası (Sayfayı Yenile)";
            }
        }
        startConnection();

        connection.on("Error", (errorMessage) => {
            // Hata geldiğinde bayrağı kaldır ve uyarıyı göster.
            hasJoinError = true;
            alert(errorMessage);
        });

        document.getElementById("btnJoin").addEventListener("click", async () => {
            if (connection.state !== signalR.HubConnectionState.Connected) {
                alert("Sunucu ile bağlantınız koptu. Lütfen sayfayı yenileyin.");
                return;
            }

            currentPin = document.getElementById("pinInput").value;
            currentNickname = document.getElementById("nicknameInput").value;

            if (currentPin && currentNickname) {
                // Her denemeden önce hata bayrağını sıfırla.
                hasJoinError = false;
                await connection.invoke("JoinGame", currentPin, currentNickname);

                // Sunucudan döndükten sonra hata bayrağını kontrol et.
                if (hasJoinError) {
                    // Hata oluştu, arayüzü giriş ekranında tut.
                    return;
                }
                // Hata yoksa bekleme ekranına geç.
                document.getElementById("loginArea").style.display = "none";
                document.getElementById("waitingArea").style.display = "block";
            }
        });

        connection.on("ReceiveQuestion", (question) => {
            currentQuestionId = question.id;
            currentOptions = question.options;
            pendingResult = { isCorrect: null, points: 0 };

            document.getElementById("mainBody").className = "bg-dark text-center mt-5";
            document.getElementById("waitingArea").style.display = "none";
            document.getElementById("resultArea").style.display = "none";
            const sLead = document.getElementById("studentTransitionLeaderboardArea");
            if (sLead) sLead.style.display = "none";
            document.getElementById("answeredArea").style.display = "none";
            document.getElementById("leaderboardArea").style.display = "none";
            document.getElementById("questionArea").style.display = "block";

            document.getElementById("studentQuestionText").textContent = question.text;
            document.getElementById("studentTimerDisplay").innerHTML = `Süre: <span id="studentTimeLimit" class="fs-2">${question.timeLimit}</span> saniye`;
            const answeredTimeSpan = document.getElementById("answeredTimeLimit");
            if (answeredTimeSpan) answeredTimeSpan.textContent = question.timeLimit;

            const optionsArea = document.getElementById("studentOptionsArea");
            optionsArea.innerHTML = "";
            const colors = ["btn-danger", "btn-primary", "btn-warning", "btn-success"];

            question.options.forEach((opt, index) => {
                const col = document.createElement("div");
                col.className = "col-6";
                col.innerHTML = `<button class="btn ${colors[index % 4]} w-100 option-btn fw-bold text-white shadow rounded-4" onclick="sendAnswer('${opt.id}')">${opt.text}</button>`;
                optionsArea.appendChild(col);
            });
        });

        async function sendAnswer(optionId) {
            document.getElementById("questionArea").style.display = "none";
            document.getElementById("answeredArea").style.display = "block";
            document.getElementById("mainBody").className = "bg-info text-center mt-5";

            await connection.invoke("SubmitAnswer", currentPin, currentNickname, currentQuestionId, optionId);
        }

        connection.on("AnswerResult", (result) => {
            pendingResult = { isCorrect: result.isCorrect, points: result.points };
        });

        connection.on("TimeUpdate", (timeLeft) => {
            const timeSpan = document.getElementById("studentTimeLimit");
            if (timeSpan) timeSpan.textContent = timeLeft;

            const answeredTimeSpan = document.getElementById("answeredTimeLimit");
            if (answeredTimeSpan) answeredTimeSpan.textContent = timeLeft;
        });

        connection.on("WaitPhase", (data) => {
            document.getElementById("questionArea").style.display = "none";
            document.getElementById("answeredArea").style.display = "none";
            document.getElementById("resultArea").style.display = "block";

            document.getElementById("resultIcon").style.display = "block";
            document.getElementById("resultText").style.display = "block";

            const body = document.getElementById("mainBody");
            const statusText = data.allAnswered ? "Herkes Cevapladı! 🏁" : "Süre Bitti! ⏰";

            if (pendingResult.isCorrect === true) {
                body.className = "bg-success text-center mt-5";
                document.getElementById("resultIcon").textContent = "✅";
                document.getElementById("resultText").innerHTML = `Tebrikler! <br><span class="display-3 fw-bold">+${pendingResult.points}</span><br>Puan Kazandın!`;
            } else if (pendingResult.isCorrect === false) {
                body.className = "bg-danger text-center mt-5";
                document.getElementById("resultIcon").textContent = "❌";
                document.getElementById("resultText").textContent = "Maalesef Yanlış!";
            } else {
                body.className = "bg-secondary text-center mt-5";
                document.getElementById("resultIcon").textContent = data.allAnswered ? "🏁" : "⏰";
                document.getElementById("resultText").textContent = `${statusText} Cevap Veremedin.`;
            }

            // Oyuncu yanlış cevap verdiyse veya cevap vermediyse, doğru cevabı göster
            if (pendingResult.isCorrect !== true && data.correctOptionId) {
                const correctOption = currentOptions.find(o => o.id === data.correctOptionId);
                if (correctOption) {
                    document.getElementById("resultText").innerHTML += `<br><small class="fw-normal mt-2 d-block">Doğru Cevap: <strong>${correctOption.text}</strong></small>`;
                }
            }

            // Liderlik tablosunu göster
            if (data.leaderboard && data.leaderboard.length > 0) {
                setTimeout(() => {
                    document.getElementById("resultIcon").style.display = "none";
                    document.getElementById("resultText").style.display = "none";
                    document.getElementById("studentTransitionLeaderboardArea").style.display = "block";
                    const list = document.getElementById("studentTransitionLeaderboardList");
                    list.innerHTML = "";
                    data.leaderboard.forEach((p, index) => {
                        const li = document.createElement("li");
                        li.className = "list-group-item d-flex justify-content-between align-items-center fw-bold";
                        if (p.nickname === currentNickname) li.classList.add("list-group-item-success");
                        let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🔸";
                        li.innerHTML = `<span>${medal} ${p.nickname}</span> <span class="badge bg-primary rounded-pill fs-6">${p.score} Puan</span>`;
                        list.appendChild(li);
                    });
                }, 2000); // 2 saniye sonra skoru/sonucu silip taboyu göster
            } else {
                document.getElementById("resultIcon").style.display = "block";
                document.getElementById("resultText").style.display = "block";
            }

            document.getElementById("nextQuestionText").textContent = `Sonraki soruya geçiliyor: ${data.waitTime} saniye...`;
        });

        connection.on("WaitTimeUpdate", (waitTime) => {
            const waitText = document.getElementById("nextQuestionText");
            if (waitText) waitText.textContent = `Sonraki soruya geçiliyor: ${waitTime} saniye...`;
            if (waitTime <= 0) document.getElementById("nextQuestionText").textContent = "Soru yükleniyor...";
        });

        // YENİ: Oyun bittiğinde öğrenci için liderlik tablosu çizilir
        connection.on("GameEnded", (players) => {
            document.getElementById("mainBody").className = "bg-primary text-center mt-5";
            document.getElementById("questionArea").style.display = "none";
            document.getElementById("answeredArea").style.display = "none";
            document.getElementById("resultArea").style.display = "none";
            document.getElementById("leaderboardArea").style.display = "block";

            const list = document.getElementById("leaderboardList");
            list.innerHTML = "";

            players.forEach((p, index) => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center fw-bold";

                // Kendi ismini yeşil renkle vurgula
                if (p.nickname === currentNickname) {
                    li.classList.add("list-group-item-success");
                }

                let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🔸";
                li.innerHTML = `<span>${medal} ${p.nickname}</span> <span class="badge bg-primary rounded-pill fs-6">${p.score} Puan</span>`;
                list.appendChild(li);
            });
        });

        connection.on("RedirectToNewGame", async (data) => {
            // Yönetici yeni bir oyun başlattı, otomatik olarak katıl.
            currentPin = data.newPin;

            // Arayüzü yeni oyunun bekleme lobisine döndür
            document.getElementById("leaderboardArea").style.display = "none";
            document.getElementById("waitingArea").style.display = "block";
            document.getElementById("waitingArea").querySelector('p').textContent = "Yönetici yeni oyunu başlattı, bekleniyor...";

            // Aynı takma ad ile yeni oyuna katıl
            await connection.invoke("JoinGame", currentPin, currentNickname);
        });

        connection.on("LobbyReset", () => {
            alert("Yönetici lobiyi iptal etti. Ana ekrana yönlendiriliyorsunuz.");
            // Arayüzü başlangıç durumuna sıfırla
            document.getElementById("waitingArea").style.display = "none";
            document.getElementById("loginArea").style.display = "block";
        });

    </script>
</body>

</html>
