<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kahoot Clone - Yönetici Ekranı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="bg-light text-center mt-5">

    <div class="container">
        <div id="lobbyArea">
            <h1 class="display-3 fw-bold text-primary mb-4">Bilgi Yarışması</h1>
            
            <div id="gameSetupArea" class="mb-4 text-start bg-white p-4 rounded shadow-sm mx-auto" style="max-width: 600px;">
                <div class="mb-3">
                    <label for="quizTitle" class="form-label fw-bold">Oyun Adı:</label>
                    <input type="text" class="form-control form-control-lg" id="quizTitle" placeholder="Örn: Genel Kültür Testi" value="Genel Kültür">
                </div>
                <div class="mb-3">
                    <label for="markdownFile" class="form-label fw-bold">Veya Dosya Yükleyin (.md / .txt):</label>
                    <input class="form-control" type="file" id="markdownFile" accept=".md,.txt">
                </div>
                <div class="mb-3">
                    <label for="markdownInput" class="form-label fw-bold">Soruları Buraya Yapıştırın (Markdown):</label>
                    <textarea class="form-control" id="markdownInput" rows="6" placeholder="# Soru: Türkiye'nin başkenti neresidir?&#10;Süre: 20&#10;- İstanbul&#10;- Ankara (*)&#10;- İzmir&#10;- Bursa"></textarea>
                    <div class="form-text">Doğru şıkkın sonuna (*) işareti koymayı unutmayın.</div>
                </div>
                <button type="button" class="btn btn-secondary w-100 mb-2 fw-bold" onclick="parseMarkdown()">1. Soruları Kontrol Et</button>
                <div id="parseResult" class="text-center fw-bold mt-2 mb-3"></div>
                <button id="btnCreateGame" class="btn btn-success btn-lg w-100 fs-3 shadow" disabled>2. Yeni Oyun Kur</button>
                <button id="btnQuickStart" class="btn btn-outline-info btn-lg w-100 mt-2 fs-5 shadow-sm">🚀 Hızlı Başlat (Örnek Sorularla)</button>
            </div>

            <div id="pinArea" class="mt-4" style="display: none;">
                <h2 class="text-muted">Oyuncuların girmesi gereken PIN:</h2>
                <h1 id="pinDisplay" class="display-1 fw-bold text-danger mt-3" style="letter-spacing: 10px;"></h1>
            </div>

            <div id="playersArea" class="mt-5" style="display: none;">
                <h3 class="mb-3">Katılan Oyuncular (<span id="playerCount">0</span>)</h3>
                <ul id="playersList" class="list-group w-50 mx-auto fs-4 shadow-sm mb-4"></ul>
                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <button id="btnStartGame" class="btn btn-warning btn-lg px-5 py-3 fs-3 fw-bold shadow">🚀 Oyunu Başlat</button>
                    <button id="btnResetLobby" class="btn btn-outline-danger btn-lg px-4 py-3 fs-4">Lobiyi İptal Et</button>
                </div>
            </div>
        </div>

        <div id="questionArea" class="mt-5" style="display: none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="text-secondary" id="questionCounter">Soru: -/-</h4>
                <button id="btnEndGame" class="btn btn-danger fw-bold">🛑 Oyunu Bitir</button>
            </div>

            <h1 id="questionText" class="display-4 fw-bold mb-4 text-dark"></h1>
            <h3 id="timerDisplay" class="text-danger mb-5">Süre: <span id="timeLimit" class="fw-bold fs-1"></span> saniye | Cevaplar: <span id="answeredCount" class="text-primary fw-bold fs-1">0</span>/<span id="totalActiveCount" class="text-secondary fs-3">0</span></h3>
            
            <div class="row w-75 mx-auto g-4" id="optionsArea"></div>

            <div id="transitionLeaderboardArea" class="mt-5" style="display: none;">
                <h3 class="mb-3 text-secondary">🏆 İlk 5 Oyuncu</h3>
                <ul id="transitionLeaderboardList" class="list-group w-50 mx-auto fs-3 shadow-lg mb-4"></ul>
            </div>
        </div>

        <div id="leaderboardArea" class="mt-5" style="display: none;">
            <h1 class="display-2 fw-bold text-success mb-4">🏆 Oyun Bitti! 🏆</h1>
            <h2 class="text-dark mb-4">Liderlik Tablosu</h2>
            <ul id="leaderboardList" class="list-group w-50 mx-auto fs-3 shadow-lg"></ul>
            <button id="btnPlayAgain" class="btn btn-primary btn-lg px-5 py-3 fs-3 fw-bold shadow mt-4" style="display: none;">🔄 Tekrar Oyna</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <script>
        let currentPin = "";
        let parsedQuestions = []; // YENİ: Dışarıdan gelen soruları hafızada tutar

        // AŞAMA 5: SignalR bağlantısına JWT Token gönderimi eklendi
        const connection = new signalR.HubConnectionBuilder().withUrl("/gamehub", { 
            skipNegotiation: true,
            transport: signalR.HttpTransportType.WebSockets,
            accessTokenFactory: () => sessionStorage.getItem('kahootCloneToken') 
        })
        .withAutomaticReconnect()
        .build();

        // YENİ: Sunucu çökerse otomatik bağlanma durumlarını yakala
        connection.onreconnecting((error) => {
            console.warn("Sunucu bağlantısı koptu, yeniden bağlanılıyor...", error);
            const timer = document.getElementById("timerDisplay");
            if (timer) timer.innerHTML = `<span class="text-danger fw-bold">Bağlantı koptu, kurtarılıyor...</span>`;
        });

        connection.onreconnected(async (connectionId) => {
            console.log("Bağlantı kurtarıldı! Yeni yedek sunucuya geçildi.");
            if (currentPin) {
                await connection.invoke("RejoinAsManager", currentPin);
            }
        });

        connection.on("PlayerJoined", (nickname) => {
            const list = document.getElementById("playersList");
            const li = document.createElement("li");
            li.className = "list-group-item list-group-item-info fw-bold";
            li.textContent = nickname;
            list.appendChild(li);
            const countSpan = document.getElementById("playerCount");
            countSpan.textContent = parseInt(countSpan.textContent) + 1;
        });

        connection.on("PlayerLeft", (nickname) => {
            const list = document.getElementById("playersList");
            const items = list.getElementsByTagName("li");
            for (let i = 0; i < items.length; i++) {
                if (items[i].textContent === nickname) {
                    list.removeChild(items[i]);
                    break;
                }
            }
            const countSpan = document.getElementById("playerCount");
            countSpan.textContent = parseInt(countSpan.textContent) - 1;
        });

        connection.on("ReceiveQuestion", (question) => {
            document.getElementById("lobbyArea").style.display = "none";
            document.getElementById("questionArea").style.display = "block";
            document.getElementById("optionsArea").style.display = "flex";
            const transArea = document.getElementById("transitionLeaderboardArea");
            if (transArea) transArea.style.display = "none";

            document.getElementById("questionCounter").textContent = `Soru: ${question.currentIndex}/${question.totalQuestions}`;
            document.getElementById("questionText").textContent = question.text;
            
            document.getElementById("timerDisplay").innerHTML = `Süre: <span id="timeLimit" class="fw-bold fs-1">${question.timeLimit}</span> saniye | Cevaplar: <span id="answeredCount" class="text-primary fw-bold fs-1">0</span>/<span id="totalActiveCount" class="text-secondary fs-3">${question.totalPlayers || 0}</span>`;

            const optionsArea = document.getElementById("optionsArea");
            optionsArea.innerHTML = ""; 
            const colors = ["bg-danger", "bg-primary", "bg-warning", "bg-success"];
            
            question.options.forEach((opt, index) => {
                const col = document.createElement("div");
                col.className = "col-6";
                col.innerHTML = `<div id="option-card-${opt.id}" class="card text-white ${colors[index % 4]} p-5 fs-2 fw-bold shadow rounded-4 h-100 d-flex align-items-center justify-content-center">${opt.text}</div>`;
                optionsArea.appendChild(col);
            });
        });

        connection.on("TimeUpdate", (timeLeft) => {
            const timeSpan = document.getElementById("timeLimit");
            if (timeSpan) timeSpan.textContent = timeLeft;
        });

        connection.on("UpdateAnswerCount", (data) => {
            const ansSpan = document.getElementById("answeredCount");
            const totSpan = document.getElementById("totalActiveCount");
            if (ansSpan) ansSpan.textContent = data.answeredCount;
            if (totSpan) totSpan.textContent = data.totalCount;
        });

        connection.on("WaitPhase", (data) => {
            const statusText = data.allAnswered ? "Herkes Cevapladı! 🏁" : "Süre Bitti! ⏰";
            document.getElementById("timerDisplay").innerHTML = `<span class='text-primary fw-bold'>${statusText} Yeni soruya geçiliyor: <span id="waitCount" class="fs-1">${data.waitTime}</span> sn</span>`;
            
            // Süre bitince doğru cevabı yeşil çerçeve ile vurgula
            if (data.correctOptionId) {
                const correctOptionCard = document.getElementById(`option-card-${data.correctOptionId}`);
                if (correctOptionCard) {
                    correctOptionCard.style.border = "10px solid lightgreen";
                }
            }

            // İlk 5 liderlik tablosunu göster
            if (data.leaderboard && data.leaderboard.length > 0) {
                setTimeout(() => {
                    document.getElementById("optionsArea").style.display = "none";
                    document.getElementById("transitionLeaderboardArea").style.display = "block";
                    const list = document.getElementById("transitionLeaderboardList");
                    list.innerHTML = "";
                    data.leaderboard.forEach((p, index) => {
                        const li = document.createElement("li");
                        li.className = "list-group-item d-flex justify-content-between align-items-center";
                        let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🔸";
                        li.innerHTML = `<span>${medal} ${p.nickname}</span> <span class="badge bg-primary rounded-pill">${p.score} Puan</span>`;
                        list.appendChild(li);
                    });
                }, 2000); // 2 saniye cevapları gördükten sonra liderliği göster
            }
        });

        connection.on("WaitTimeUpdate", (waitTime) => {
            const waitSpan = document.getElementById("waitCount");
            if (waitSpan) waitSpan.textContent = waitTime;
            if (waitTime <= 0) document.getElementById("timerDisplay").innerHTML = "<span class='text-primary fw-bold'>Soru yükleniyor...</span>";
        });

        connection.on("RestoreGameState", (state) => {
            if (!state || !state.quiz) {
                sessionStorage.removeItem('kahootClonePin');
                sessionStorage.removeItem('kahootCloneToken');
                alert("Oyun durumu geri yüklenemedi, oturum sonlandırıldı.");
                location.reload();
                return;
            }

            // --- Arayüzü Geri Yükle ---
            const setupArea = document.getElementById("gameSetupArea");
            if(setupArea) setupArea.style.display = "none";
            document.getElementById("pinArea").style.display = "block";
            document.getElementById("playersArea").style.display = "block";
            document.getElementById("pinDisplay").textContent = state.quiz.pin;

            // Oyuncu listesini geri yükle
            const list = document.getElementById("playersList");
            list.innerHTML = "";
            state.quiz.players.forEach(p => {
                const li = document.createElement("li");
                li.className = "list-group-item list-group-item-info fw-bold";
                li.textContent = p.nickname;
                list.appendChild(li);
            });
            document.getElementById("playerCount").textContent = state.quiz.players.length;

            // Oyunun hangi aşamada olduğunu kontrol et
            if (state.gameState) { // Oyun başlamış
                document.getElementById("lobbyArea").style.display = "none";
                document.getElementById("questionArea").style.display = "block";

                const question = state.currentQuestion;
                const gameState = state.gameState;

                document.getElementById("questionCounter").textContent = `Soru: ${gameState.currentQuestionIndex + 1}/${state.quiz.questionsCount}`;
                document.getElementById("questionText").textContent = question.text;

                // Zamanlayıcıyı faza göre geri yükle
                if (gameState.phase === 'Question') {
                    document.getElementById("timerDisplay").innerHTML = `Süre: <span id="timeLimit" class="fw-bold fs-1">${gameState.timeRemaining}</span> saniye | Cevaplar: <span id="answeredCount" class="text-primary fw-bold fs-1">${state.answeredCount}</span>/<span id="totalActiveCount" class="text-secondary fs-3">${state.totalActiveCount}</span>`;
                } else if (gameState.phase === 'Transition') {
                    document.getElementById("timerDisplay").innerHTML = `<span class='text-primary fw-bold'>Süre Bitti! Yeni soruya geçiliyor: <span id="waitCount" class="fs-1">${gameState.timeRemaining}</span> sn</span>`;
                }
                
                // Şıkları geri yükle
                const optionsArea = document.getElementById("optionsArea");
                optionsArea.innerHTML = ""; 
                const colors = ["bg-danger", "bg-primary", "bg-warning", "bg-success"];
                question.options.forEach((opt, index) => {
                    const col = document.createElement("div");
                    col.className = "col-6";
                    col.innerHTML = `<div id="option-card-${opt.id}" class="card text-white ${colors[index % 4]} p-5 fs-2 fw-bold shadow rounded-4 h-100 d-flex align-items-center justify-content-center">${opt.text}</div>`;
                    optionsArea.appendChild(col);
                });
            } else {
                // YENİ: Failover (Çökme) anında yönetici geri döndüğünde oyun bitmişse tabloyu gösterir
                if (!state.quiz.isActive || state.quiz.players.some(p => p.score > 0)) {
                    document.getElementById("lobbyArea").style.display = "none";
                    document.getElementById("questionArea").style.display = "none";
                    document.getElementById("leaderboardArea").style.display = "block";

                    const list = document.getElementById("leaderboardList");
                    list.innerHTML = "";
                    document.getElementById("btnPlayAgain").style.display = "inline-block";
                    
                    const sortedPlayers = state.quiz.players.sort((a, b) => b.score - a.score);
                    sortedPlayers.forEach((p, index) => {
                        const li = document.createElement("li");
                        li.className = "list-group-item d-flex justify-content-between align-items-center";
                        let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🔸";
                        li.innerHTML = `<span>${medal} ${p.nickname}</span> <span class="badge bg-primary rounded-pill">${p.score} Puan</span>`;
                        list.appendChild(li);
                    });
                }
            }
        });

        connection.on("RedirectToNewGame", async (data) => {
            // Yönetici yeni bir oyun başlattı, arayüzü lobiye döndür.
            currentPin = data.newPin;
            sessionStorage.setItem('kahootClonePin', currentPin);

            // Arayüzü lobi durumuna sıfırla
            document.getElementById("leaderboardArea").style.display = "none";
            document.getElementById("lobbyArea").style.display = "block";
            document.getElementById("questionArea").style.display = "none";
            document.getElementById("btnPlayAgain").style.display = "none";

            // Yeni PIN'i göster
            document.getElementById("pinDisplay").textContent = currentPin;
            const setupArea = document.getElementById("gameSetupArea");
            if(setupArea) setupArea.style.display = "none";
            document.getElementById("pinArea").style.display = "block";
            document.getElementById("playersArea").style.display = "block";

            // Arayüzdeki eski listeyi temizle, öğrenciler SignalR üzerinden otomatik bağlandıkça (PlayerJoined) listeye eklenecek
            const list = document.getElementById("playersList");
            list.innerHTML = "";
            document.getElementById("playerCount").textContent = "0";

            // Yeni oyunun grubuna yönetici olarak katıl
            await connection.invoke("JoinAsManager", currentPin);
        });

        connection.on("GameEnded", (players) => {
            sessionStorage.removeItem('kahootClonePin');
            sessionStorage.removeItem('kahootCloneToken');
            document.getElementById("questionArea").style.display = "none";
            document.getElementById("leaderboardArea").style.display = "block";

            const list = document.getElementById("leaderboardList");
            list.innerHTML = "";
            document.getElementById("btnPlayAgain").style.display = "inline-block";
            players.forEach((p, index) => {
                const li = document.createElement("li");
                li.className = "list-group-item d-flex justify-content-between align-items-center";
                let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🔸";
                li.innerHTML = `<span>${medal} ${p.nickname}</span> <span class="badge bg-primary rounded-pill">${p.score} Puan</span>`;
                list.appendChild(li);
            });
        });

        // YENİ: Markdown metnini API'ye gönderip doğrulatır ve nesneye çevirir.
        async function parseMarkdown() {
            const markdownText = document.getElementById('markdownInput').value;
            const resultDiv = document.getElementById('parseResult');
            const btnCreate = document.getElementById('btnCreateGame');
            
            if (!markdownText || markdownText.trim() === '') {
                resultDiv.className = "text-danger fw-bold mt-2 mb-3";
                resultDiv.innerText = "Lütfen önce metin kutusuna soru yapıştırın.";
                btnCreate.disabled = true;
                return;
            }

            try {
                const response = await fetch('/api/Quiz/parse-markdown', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ markdownText: markdownText })
                });

                if (response.ok) {
                    parsedQuestions = await response.json();
                    if (parsedQuestions.length > 0) {
                        resultDiv.className = "text-success fw-bold mt-2 mb-3";
                        resultDiv.innerText = `Başarılı! Toplam ${parsedQuestions.length} soru algılandı. Oyunu kurabilirsiniz.`;
                        btnCreate.disabled = false; // Oyunu Kur butonunu aktif et
                    } else {
                        resultDiv.className = "text-danger fw-bold mt-2 mb-3";
                        resultDiv.innerText = "Soru bulunamadı. Lütfen formatı kontrol edin.";
                        btnCreate.disabled = true;
                    }
                } else {
                    const error = await response.json();
                    resultDiv.className = "text-danger fw-bold mt-2 mb-3";
                    resultDiv.innerText = "Ayrıştırma hatası: " + (error.Message || "Bilinmeyen bir hata oluştu.");
                    btnCreate.disabled = true;
                }
            } catch (err) {
                console.error(err);
                resultDiv.className = "text-danger fw-bold mt-2 mb-3";
                resultDiv.innerText = "Sunucuya bağlanılamadı.";
                btnCreate.disabled = true;
            }
        }

        // YENİ: Dosya seçildiğinde içeriğini okur, metin kutusuna yazar ve otomatik kontrol eder.
        document.getElementById("markdownFile").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                // Okunan metni kutuya yapıştır
                document.getElementById('markdownInput').value = event.target.result;
                // Otomatik olarak ayrıştırma (parse) işlemini tetikle
                parseMarkdown();
            };
            reader.readAsText(file);
        });

        document.getElementById("btnCreateGame").addEventListener("click", async () => {
            const title = document.getElementById("quizTitle").value || "Genel Kültür";
            
            const payload = {
                title: title,
                questions: parsedQuestions
            };

            const response = await fetch("/api/quiz/create", { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(payload) 
            });

            if (response.ok) {
                const data = await response.json();
                currentPin = data.pin;
                sessionStorage.setItem('kahootClonePin', currentPin);
                sessionStorage.setItem('kahootCloneToken', data.token); // AŞAMA 5: Token tarayıcı hafızasına kaydedildi
                document.getElementById("pinDisplay").textContent = currentPin;
                
                document.getElementById("gameSetupArea").style.display = "none";
                document.getElementById("pinArea").style.display = "block";
                document.getElementById("playersArea").style.display = "block";

                // AŞAMA 5: Token ile kimlik doğrulaması yapmak için bağlantı yeniden başlatılır
                if (connection.state !== signalR.HubConnectionState.Disconnected) {
                    await connection.stop();
                }
                await connection.start();
                await connection.invoke("JoinAsManager", currentPin.toString());
            }
        });

        // YENİ: Geliştirme ve test aşamasında zaman kazanmak için Markdown adımlarını atlar.
        document.getElementById("btnQuickStart").addEventListener("click", async () => {
            const title = document.getElementById("quizTitle").value || "Geliştirici Testi";
            
            const payload = {
                title: title,
                questions: [] // Boş liste gönderilir, böylece Backend gömülü örnek soruları (GenerateSampleQuestions) kullanır.
            };

            const response = await fetch("/api/quiz/create", { 
                method: "POST", 
                headers: { "Content-Type": "application/json" }, 
                body: JSON.stringify(payload) 
            });

            if (response.ok) {
                const data = await response.json();
                currentPin = data.pin;
                sessionStorage.setItem('kahootClonePin', currentPin);
                sessionStorage.setItem('kahootCloneToken', data.token);
                document.getElementById("pinDisplay").textContent = currentPin;
                
                document.getElementById("gameSetupArea").style.display = "none";
                document.getElementById("pinArea").style.display = "block";
                document.getElementById("playersArea").style.display = "block";

                if (connection.state !== signalR.HubConnectionState.Disconnected) {
                    await connection.stop();
                }
                await connection.start();
                await connection.invoke("JoinAsManager", currentPin.toString());
            }
        });

        document.getElementById("btnStartGame").addEventListener("click", async () => {
            if (connection.state !== signalR.HubConnectionState.Connected) { 
                alert("Sunucu ile bağlantınız koptu. Lütfen sayfayı yenileyin."); return; 
            }
            await connection.invoke("StartGame", currentPin.toString());
        });

        document.getElementById("btnEndGame").addEventListener("click", async () => {
            if(confirm("Oyunu erken bitirmek istediğinize emin misiniz?")) {
                sessionStorage.removeItem('kahootClonePin');
                sessionStorage.removeItem('kahootCloneToken');
                if (connection.state !== signalR.HubConnectionState.Connected) return;
                await connection.invoke("EndGame", currentPin.toString());
            }
        });

        document.getElementById("btnPlayAgain").addEventListener("click", async () => {
            if (connection.state !== signalR.HubConnectionState.Connected) { 
                alert("Sunucu ile bağlantınız koptu. Lütfen sayfayı yenileyin."); return; 
            }
            await connection.invoke("PlayAgain", currentPin);
        });

        document.getElementById("btnResetLobby").addEventListener("click", async () => {
            if (confirm("Mevcut lobi iptal edilecek ve tüm oyuncular atılacak. Emin misiniz?")) {
                if (connection.state !== signalR.HubConnectionState.Connected) { 
                    alert("Sunucu ile bağlantınız koptu. Lütfen sayfayı yenileyin."); return; 
                }
                await connection.invoke("ResetLobby", currentPin);
            }
        });

        // Sayfa yüklendiğinde çalışacak ana fonksiyon
        async function initialize() {
            try {
                if (connection.state === signalR.HubConnectionState.Disconnected) {
                    await connection.start();
                }
                const storedPin = sessionStorage.getItem('kahootClonePin');
                if (storedPin && connection.state === signalR.HubConnectionState.Connected) {
                    currentPin = storedPin;
                    await connection.invoke("RejoinAsManager", currentPin);
                }
            } catch (err) {
                console.error("SignalR bağlantı hatası: ", err);
            }
        }

        connection.on("LobbyReset", () => {
            sessionStorage.removeItem('kahootClonePin');
            sessionStorage.removeItem('kahootCloneToken');
            location.reload();
        });

        initialize();
    </script>
</body>
</html>
