
services:
  mongodb:
    # MongoDB'nin en güncel resmi imajı internetten çekilir.
    image: mongo:latest
    
    # Konteynerin adı belirlenir.
    container_name: kahoot_mongo_db
    restart: always
    
    # Bilgisayarının 27017 portu, konteynerin 27017 portuyla eşleştirilir.
    ports:
      - "27017:27017"
      
    # YENİ: MongoDB varsayılan olarak sistem RAM'inin %50'sini (Cache) kendine ayırır.
    # Bunu engelleyip maksimum 256 MB RAM kullanmasını zorluyoruz.
    deploy:
      resources:
        limits:
          memory: 256M

    # Konteyner kapansa bile verilerin silinmemesi için kalıcı bir hafıza (volume) oluşturulur.
    volumes:
      - mongo_data:/data/db

  redis:
    # Redis'in hafif ve hızlı olan alpine sürümü çekilir.
    image: redis:alpine
    container_name: kahoot_redis
    restart: always
    # Uygulamanın Redis'e bağlanabilmesi için varsayılan port dışarı açılır.
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kahoot_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" # Tarayıcıdan izlenebilen Yönetim Paneli

  # Merkezi Loglama Sunucusu (Serilog ile konuşur)
  seq:
    image: datalust/seq:latest
    container_name: kahoot_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_API_LISTEN_URIS=http://+:5341
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True
    ports:
      - "5341:5341"

  # Metrik Toplayıcı
  prometheus:
    image: prom/prometheus:latest
    container_name: kahoot_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Görsel Metrik Panelleri (Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: kahoot_grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  api:
    # API'mizi az önce yazdığımız Dockerfile üzerinden derlemesini söylüyoruz.
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MongoDbSettings__ConnectionString=mongodb://mongodb:27017
      - Redis__ConnectionString=redis:6379
      - RabbitMq__HostName=rabbitmq
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=${JWT_SECRET_KEY:-KahootCloneDefaultKey_For_Dev_12345!}
    restart: always

    deploy:
      resources:
        limits:
          memory: 512M

    # API'nin çalışması için önce DB ve Redis'in hazır olmasını bekliyoruz.
    depends_on:
      - mongodb
      - redis
      - rabbitmq

  # Yük Dengeleyici (Load Balancer) - Tüm dış trafiği bu servis karşılar
  nginx:
    image: nginx:alpine
    container_name: kahoot_nginx
    restart: always
    ports:
      - "5252:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  frontend:
    build:
      context: ./kahoot-frontend
      dockerfile: Dockerfile
    container_name: kahoot_frontend
    restart: always
    ports:
      # Host'un 5173 portunu, konteynerin içindeki 80 (Nginx) portuna bağlar.
      - "5173:80"
    depends_on:
      - api

volumes:
  # Veritabanı dosyalarının fiziksel olarak tutulacağı alan tanımlanır.
  mongo_data: