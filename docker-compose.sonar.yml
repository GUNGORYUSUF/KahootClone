# docker-compose.sonar.yml
# SonarQube Kod Kalite Analiz Sunucusu - Docker ile tamamen izole calisir.
# Baslatmak icin : docker compose -f docker-compose.sonar.yml up -d
# Durdurmak icin : docker compose -f docker-compose.sonar.yml down

services:
  sonarqube:
    image: sonarqube:community
    container_name: kahoot_sonarqube
    ports:
      - "9000:9000"
    environment:
      # Windows Docker Desktop'ta Elasticsearch'un kernel parametresi olmadan
      # calismasini saglar (vm.max_map_count ayari gerekmez).
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    deploy:
      resources:
        limits:
          memory: 2G
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
